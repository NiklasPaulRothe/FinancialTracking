{% extends "base.html" %}

{% block title %}Seite nicht gefunden – Haushaltsbuch{% endblock %}

{% block content %}

    <div class="col-md-6 text-center">
        <h1 class="display-1 text-muted">404</h1>
        <h2 class="mb-3">Seite nicht gefunden</h2>

            <i class="bi bi-house-door me-1"></i>Zurück zum Dashboard

    </div>
</div>
{% endblock %}
